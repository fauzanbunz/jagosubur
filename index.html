<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGO SUBUR - Command Center</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        
        body { 
            background: url('https://raw.githubusercontent.com/fauzanbunz/jagosubur/main/Lanskap%20Sawah%20Jago%20Subur%20saat%20Fajar.png') no-repeat center center fixed; 
            background-size: cover; height: 100vh; overflow: hidden; 
        }

        /* --- LAYAR LOGIN --- */
        #login-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(6, 78, 59, 0.8); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-card { background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); width: 400px; text-align: center; border: 2px solid #10B981; }
        .login-card img { width: 100px; margin-bottom: 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        .login-card h2 { color: #10B981; font-weight: 900; font-size: 32px; margin-bottom: 5px; }
        .login-card p { color: #6B7280; margin-bottom: 30px; font-size: 14px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group input { width: 100%; padding: 15px; border: 2px solid #E5E7EB; border-radius: 12px; font-size: 15px; outline: none; transition: all 0.3s; background: #F9FAFB; }
        .input-group input:focus { border-color: #10B981; background: #fff; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1); }
        .btn-login { width: 100%; background: linear-gradient(135deg, #10B981, #059669); color: white; padding: 15px; border: none; border-radius: 12px; font-size: 18px; font-weight: 800; cursor: pointer; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s; }
        .btn-login:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4); }
        #login-error { color: #EF4444; font-size: 13px; margin-top: 15px; display: none; font-weight: 600; }

        /* --- DASHBOARD UTAMA --- */
        #dashboard-screen { display: none; width: 100%; height: 100%; display: flex; padding: 20px; gap: 20px; }
        
        .sidebar { width: 380px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); border-radius: 25px; border: 1px solid rgba(255,255,255,0.5); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .sidebar-header { padding: 25px 20px 15px; text-align: center; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .sidebar-header img { height: 60px; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1)); }
        .sidebar-header h1 { font-size: 26px; font-weight: 900; color: #064E3B; margin-top: 5px; line-height: 1.2;}
        .sidebar-header p { font-size: 13px; color: #059669; font-weight: 600; }
        
        .menu-container { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: rgba(255,255,255,0.5); }
        .btn-menu { background: white; border: 2px solid #10B981; color: #10B981; padding: 12px; border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .btn-menu:hover, .btn-menu.active { background: linear-gradient(135deg, #10B981, #059669); color: white; transform: scale(1.05) translateY(-3px); box-shadow: 0 8px 15px rgba(16, 185, 129, 0.3); border-color: transparent; }
        .btn-logout-small { grid-column: span 2; background: #FEE2E2; color: #EF4444; border: none; padding: 10px; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-logout-small:hover { background: #FECACA; transform: scale(1.02); }

        .content-area { flex: 1; padding: 15px; overflow-y: auto; }
        .content-title { font-size: 16px; font-weight: 800; color: #111827; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}
        
        .data-card { background: white; padding: 15px; border-radius: 15px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #10B981; cursor: pointer; transition: 0.3s; }
        .data-card:hover { transform: translateX(5px); box-shadow: 0 6px 12px rgba(16,185,129,0.15); }
        .data-title { font-weight: 800; color: #111827; font-size: 15px; }
        .data-subtitle { font-size: 12px; color: #6B7280; margin-top: 3px; font-weight: 600; }
        .data-desc { font-size: 12px; color: #4B5563; margin-top: 8px; font-style: italic; background: #F3F4F6; padding: 8px; border-radius: 8px; }

        .map-wrapper { flex: 1; border-radius: 25px; overflow: hidden; border: 5px solid rgba(255, 255, 255, 0.6); box-shadow: 0 15px 35px rgba(0,0,0,0.3); position: relative; background: white; }
        #map { width: 100%; height: 100%; z-index: 1; }
        
        .live-indicator { position: absolute; top: 20px; right: 20px; z-index: 1000; background: rgba(16, 185, 129, 0.9); color: white; padding: 8px 20px; border-radius: 30px; font-weight: 800; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); animation: pulse 2s infinite; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(5px);}
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #10B981; border-radius: 10px; }

        /* --- KUSTOMISASI POPUP PROFIL SALES DI KANAN --- */
        .profile-popup-custom .leaflet-popup-content-wrapper { 
            padding: 0 !important; 
            border-radius: 20px; 
            overflow: hidden; 
            border: 3px solid #10B981; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.3) !important; 
        }
        .profile-popup-custom .leaflet-popup-content { margin: 0 !important; width: 330px !important; }
        
        /* Menghilangkan ekor/segitiga popup agar terlihat seperti melayang */
        .profile-popup-custom .leaflet-popup-tip-container { display: none !important; }
        
        /* Custom scrollbar untuk histori dalam popup */
        .history-scroll::-webkit-scrollbar { width: 4px; }
        .history-scroll::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 10px; }
        
        .leaflet-popup-content-wrapper { padding: 0 !important; overflow: hidden; border-radius: 15px;}
        .leaflet-popup-content { margin: 0 !important; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <img src="https://raw.githubusercontent.com/fauzanbunz/jagosubur/main/jagosuburlogo.png" alt="Logo">
            <h2>HQ CONTROL</h2>
            <p>Jago Subur Command Center</p>
            <div class="input-group">
                <input type="text" id="admin-user" placeholder="Username Admin">
            </div>
            <div class="input-group">
                <input type="password" id="admin-pass" placeholder="Password">
            </div>
            <button class="btn-login" onclick="prosesLogin()">Masuk Sistem</button>
            <div id="login-error">Kredensial salah atau Anda bukan Admin!</div>
        </div>
    </div>

    <div id="dashboard-screen">
        <div class="sidebar">
            <div class="sidebar-header">
                <img src="https://raw.githubusercontent.com/fauzanbunz/jagosubur/main/jagosuburlogo.png" alt="Logo">
                <h1>JAGO SUBUR</h1>
                <p>Welcome, <span id="admin-name">Bos</span></p>
            </div>
            
            <div class="menu-container">
                <button class="btn-menu active" id="menu-track" onclick="ubahMenu('track')">
                    <span style="font-size: 20px;">📍</span> Sales Track
                </button>
                <button class="btn-menu" id="menu-report" onclick="ubahMenu('report')">
                    <span style="font-size: 20px;">📝</span> Report Kunjungan
                </button>
                <button class="btn-menu" id="menu-stats" onclick="ubahMenu('stats')" style="grid-column: span 2;">
                    <span style="font-size: 20px;">📊</span> Overview & Statistik
                </button>
                <button class="btn-logout-small" onclick="location.reload()">Keluar (Logout)</button>
            </div>

            <div class="content-area" id="panel-content"></div>
        </div>

        <div class="map-wrapper">
            <div class="live-indicator">
                <div style="width: 10px; height: 10px; background: white; border-radius: 50%;"></div> LIVE SYNC
            </div>
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // API KEY SUPABASE SUDAH DISISIPKAN OTOMATIS
        const supabaseUrl = 'https://cuwtrhdgwyxyuipthdbg.supabase.co';
        const supabaseKey = 'sb_publishable_syDLCuoKh9NKTRsfTRmpyQ_a3r5_GQG'; 
        const db = supabase.createClient(supabaseUrl, supabaseKey);

        let map, routeLine, layerToko, layerLive, sinkronisasiBerkala;
        let dataSalesTerakhir = {}; 
        let dataLaporan = []; 
        let menuAktif = 'track';

        async function prosesLogin() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            const btn = document.querySelector('.btn-login');
            
            if(!user || !pass) return;
            btn.innerText = "Memverifikasi...";

            const { data, error } = await db.from('sales_team')
                .select('*').eq('username', user).eq('password', pass).eq('role', 'admin').single();

            if (error || !data) {
                document.getElementById('login-error').style.display = 'block';
                btn.innerText = "Masuk Sistem";
            } else {
                document.getElementById('admin-name').innerText = data.nama_lengkap;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'flex';
                inisialisasiPeta();
            }
        }

        function inisialisasiPeta() {
            map = L.map('map', { zoomControl: false }).setView([-7.3692565, 112.6768411], 14);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { attribution: '© Google Maps' }).addTo(map);

            routeLine = L.polyline([], {color: '#10B981', weight: 6, opacity: 0.7}).addTo(map);
            layerToko = L.layerGroup().addTo(map);
            layerLive = L.layerGroup().addTo(map);

            tarikDataSupabase();
            sinkronisasiBerkala = setInterval(tarikDataSupabase, 5000);
        }

        const ikonToko = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        const ikonLive = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        function terbangKeLokasi(lat, lng, nama) {
            map.flyTo([lat, lng], 17, { animate: true, duration: 1.5 });
        }

        function ubahMenu(menu) {
            menuAktif = menu;
            document.querySelectorAll('.btn-menu').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`menu-${menu}`).classList.add('active');
            renderPanelKiri();
        }

        async function tarikDataSupabase() {
            // 1. Tarik Data Laporan Kunjungan Terlebih Dahulu (Agar histori siap dipakai di profil)
            const resToko = await db.from('laporan_kunjungan').select('*').order('created_at', { ascending: false });
            if (resToko.data) {
                dataLaporan = resToko.data;
                layerToko.clearLayers();
                dataLaporan.forEach(toko => {
                    if (toko.latitude_checkin && toko.longitude_checkin) {
                        const idCardHTML = `<div style="font-family: 'Poppins'; width: 220px; text-align: center; border: 2px solid #3B82F6;">
                            <div style="background: #3B82F6; color: white; padding: 10px; font-weight: 800; font-size: 15px;">👤 ${toko.nama_sales}</div>
                            <div style="padding: 15px; background: white;">
                                <span style="font-size: 10px; color: gray; font-weight:bold;">VISIT TOKO</span><br>
                                <b style="font-size: 15px; color: #111827;">🏪 ${toko.nama_toko_klien}</b>
                                <hr style="margin: 8px 0; border: 0; border-top: 1px dashed #ccc;">
                                <i style="font-size: 12px; color: #4B5563;">"${toko.catatan_pertemuan}"</i>
                            </div></div>`;
                        L.marker([toko.latitude_checkin, toko.longitude_checkin], {icon: ikonToko})
                         .bindPopup(idCardHTML).addTo(layerToko);
                    }
                });
            }

            // 2. Tarik Rute & Hitung Titik Live
            const resRute = await db.from('location_breadcrumbs').select('*').order('recorded_at', { ascending: true });
            if (resRute.data && resRute.data.length > 0) {
                const latlngs = resRute.data.map(t => [t.latitude, t.longitude]);
                routeLine.setLatLngs(latlngs);
                
                layerLive.clearLayers();
                dataSalesTerakhir = {}; 
                
                resRute.data.forEach(titik => {
                    if (titik.nama_sales) dataSalesTerakhir[titik.nama_sales] = titik;
                });

                Object.values(dataSalesTerakhir).forEach(sales => {
                    // Filter Histori Khusus Untuk Sales Ini
                    let historyHTML = '';
                    let laporanSalesIni = dataLaporan.filter(l => l.nama_sales === sales.nama_sales);
                    
                    if (laporanSalesIni.length > 0) {
                        laporanSalesIni.forEach(lap => {
                            historyHTML += `
                                <div style="border-left: 3px solid #10B981; padding-left: 15px; margin-bottom: 12px; position: relative;">
                                    <div style="position: absolute; left: -7.5px; top: 0; width: 12px; height: 12px; background: #10B981; border-radius: 50%; border: 2px solid white;"></div>
                                    <b style="font-size: 14px; color: #111827; display: block; margin-bottom: 2px;">🏪 ${lap.nama_toko_klien}</b>
                                    <i style="font-size: 12px; color: #4B5563;">"${lap.catatan_pertemuan}"</i>
                                </div>
                            `;
                        });
                    } else {
                        historyHTML = `<div style="font-size: 12px; color: #9CA3AF; text-align: center; padding: 20px; font-style: italic;">Belum ada kunjungan toko hari ini.</div>`;
                    }

                    // Struktur Kartu Profil Besar
                    const profilePopupHTML = `
                        <div style="width: 330px; font-family: 'Poppins', sans-serif;">
                            <!-- Header Foto Besar & Tema Sawah -->
                            <div style="display: flex; align-items: center; gap: 15px; padding: 20px; background: url('https://raw.githubusercontent.com/fauzanbunz/jagosubur/main/Lanskap%20Sawah%20Jago%20Subur%20saat%20Fajar.png') center/cover; position: relative;">
                                <div style="position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(6, 78, 59, 0.85);"></div>
                                <img src="https://ui-avatars.com/api/?name=${sales.nama_sales}&background=10B981&color=fff&size=75&bold=true" style="border-radius: 50%; border: 3px solid white; width: 75px; height: 75px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: relative; z-index: 1;">
                                <div style="position: relative; z-index: 1; color: white;">
                                    <div style="font-weight: 900; font-size: 22px; line-height: 1.2; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">${sales.nama_sales}</div>
                                    <div style="font-size: 13px; font-weight: 600; color: #34D399; margin-top: 3px;">💼 Sales Executive</div>
                                </div>
                            </div>
                            <!-- Histori Kunjungan -->
                            <div class="history-scroll" style="padding: 20px; background: white; max-height: 250px; overflow-y: auto;">
                                <div style="font-size: 12px; font-weight: 800; color: #6B7280; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;">📍 Histori Hari Ini</div>
                                ${historyHTML}
                            </div>
                        </div>
                    `;

                    L.marker([sales.latitude, sales.longitude], {icon: ikonLive})
                     .bindPopup(profilePopupHTML, { 
                         className: 'profile-popup-custom', 
                         minWidth: 330,
                         offset: [180, 20] // <-- KOORDINAT INI YANG MENGGESER POPUP KE SEBELAH KANAN MARKER
                     })
                     .addTo(layerLive);
                });
            }
            renderPanelKiri();
        }

        function renderPanelKiri() {
            const panel = document.getElementById('panel-content');
            let html = '';

            if (menuAktif === 'track') {
                html += `<div class="content-title">📡 Tim di Lapangan <span style="background:#10B981;color:white;padding:2px 8px;border-radius:10px;font-size:12px;">${Object.keys(dataSalesTerakhir).length} Aktif</span></div>`;
                Object.values(dataSalesTerakhir).forEach(sales => {
                    html += `
                    <div class="data-card" onclick="terbangKeLokasi(${sales.latitude}, ${sales.longitude}, '${sales.nama_sales}')">
                        <div class="data-title">👤 ${sales.nama_sales}</div>
                        <div class="data-subtitle">📍 Klik untuk melacak titik GPS</div>
                    </div>`;
                });
                if(Object.keys(dataSalesTerakhir).length === 0) html += `<div style="text-align:center; color:gray; font-size:13px; margin-top:20px;">Tidak ada pergerakan saat ini.</div>`;
            } 
            else if (menuAktif === 'report') {
                html += `<div class="content-title">📑 Laporan Terbaru</div>`;
                dataLaporan.forEach(toko => {
                    html += `
                    <div class="data-card" onclick="terbangKeLokasi(${toko.latitude_checkin}, ${toko.longitude_checkin}, '${toko.nama_toko_klien}')" style="border-left-color: #3B82F6;">
                        <div class="data-title">🏪 ${toko.nama_toko_klien}</div>
                        <div class="data-subtitle">Oleh: <b>${toko.nama_sales}</b></div>
                        <div class="data-desc">"${toko.catatan_pertemuan}"</div>
                    </div>`;
                });
                if(dataLaporan.length === 0) html += `<div style="text-align:center; color:gray; font-size:13px; margin-top:20px;">Belum ada laporan masuk.</div>`;
            }
            else if (menuAktif === 'stats') {
                html += `
                <div class="content-title">📊 Ringkasan Operasional</div>
                <div style="background: linear-gradient(135deg, #10B981, #059669); color: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; text-align: center; box-shadow: 0 5px 15px rgba(16,185,129,0.3);">
                    <div style="font-size: 35px; font-weight: 900;">${Object.keys(dataSalesTerakhir).length}</div>
                    <div style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Sales Aktif Bergerak</div>
                </div>
                <div style="background: linear-gradient(135deg, #3B82F6, #1D4ED8); color: white; padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 5px 15px rgba(59,130,246,0.3);">
                    <div style="font-size: 35px; font-weight: 900;">${dataLaporan.length}</div>
                    <div style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Total Kunjungan Toko</div>
                </div>`;
            }
            panel.innerHTML = html;
        }
    </script>
</body>
</html>
