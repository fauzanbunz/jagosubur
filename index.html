<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGO SUBUR HQ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        body { background-color: #F3F4F6; height: 100vh; overflow: hidden; }

        /* Layar Login */
        #login-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #064E3B, #10B981); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 400px; text-align: center; }
        .login-card img { width: 90px; margin-bottom: 10px; }
        .login-card h2 { color: #10B981; font-weight: 900; font-size: 28px; margin-bottom: 5px; }
        .login-card p { color: #6B7280; margin-bottom: 30px; font-size: 14px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group input { width: 100%; padding: 12px 15px; border: 1px solid #D1D5DB; border-radius: 10px; font-size: 15px; outline: none; }
        .input-group input:focus { border-color: #10B981; }
        .btn-login { width: 100%; background: #10B981; color: white; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .btn-login:hover { background: #059669; }
        #login-error { color: #EF4444; font-size: 13px; margin-top: 10px; display: none; }

        /* Dashboard Utama */
        #dashboard-screen { display: none; width: 100%; height: 100%; display: flex; flex-direction: column; }
        header { background: white; padding: 10px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); z-index: 10; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand img { height: 40px; }
        .brand h1 { font-size: 22px; font-weight: 900; color: #10B981; margin-top: 5px; }
        .status-badge { background: #10B981; color: white; padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: 600; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.3); margin-left: 10px; }
        .admin-profile { font-size: 14px; color: #4B5563; font-weight: 600; display: flex; gap: 15px; align-items: center;}
        .btn-logout { background: #FEE2E2; color: #EF4444; padding: 5px 15px; border-radius: 8px; text-decoration: none; font-size: 12px; cursor: pointer; border: none; font-weight: 600;}
        
        #map-container { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; z-index: 1; }
        
        /* Hapus padding default Leaflet agar ID Card penuh */
        .leaflet-popup-content-wrapper { padding: 0 !important; overflow: hidden; border-radius: 12px; }
        .leaflet-popup-content { margin: 0 !important; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <img src="https://raw.githubusercontent.com/fauzanbunz/jagosubur/main/jagosuburlogo.png" alt="Logo">
            <h2>JAGO SUBUR</h2>
            <p>HQ Control Dashboard</p>
            <div class="input-group">
                <input type="text" id="admin-user" placeholder="Username Admin">
            </div>
            <div class="input-group">
                <input type="password" id="admin-pass" placeholder="Password">
            </div>
            <button class="btn-login" onclick="prosesLogin()">Akses Dashboard</button>
            <div id="login-error">Kredensial salah atau Anda bukan Admin!</div>
        </div>
    </div>

    <div id="dashboard-screen">
        <header>
            <div class="brand">
                <img src="https://raw.githubusercontent.com/fauzanbunz/jagosubur/main/jagosuburlogo.png" alt="Logo">
                <h1>JAGO SUBUR</h1>
                <div class="status-badge">LIVE SYNC</div>
            </div>
            <div class="admin-profile">
                <span>Halo, <span id="admin-name">Bos</span></span>
                <button class="btn-logout" onclick="location.reload()">Keluar</button>
            </div>
        </header>
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // 1. MASUKKAN KUNCI SUPABASE DI SINI
        const supabaseUrl = 'https://cuwtrhdgwyxyuipthdbg.supabase.co';
        const supabaseKey = 'sb_publishable_syDLCuoKh9NKTRsfTRmpyQ_a3r5_GQG'; 
        const db = supabase.createClient(supabaseUrl, supabaseKey);

        let map, routeLine, layerToko, layerLive, sinkronisasiBerkala;

        async function prosesLogin() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            const btn = document.querySelector('.btn-login');
            
            if(!user || !pass) return;
            btn.innerText = "Memverifikasi...";

            const { data, error } = await db.from('sales_team')
                .select('*').eq('username', user).eq('password', pass).eq('role', 'admin').single();

            if (error || !data) {
                document.getElementById('login-error').style.display = 'block';
                btn.innerText = "Akses Dashboard";
            } else {
                document.getElementById('admin-name').innerText = data.nama_lengkap;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'flex';
                inisialisasiPeta();
            }
        }

        function inisialisasiPeta() {
            map = L.map('map').setView([-7.3692565, 112.6768411], 15);
            L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { attribution: '© Google Maps' }).addTo(map);

            // Garis rute pergerakan
            routeLine = L.polyline([], {color: '#10B981', weight: 6, opacity: 0.8}).addTo(map);
            
            // Layer terpisah agar pin tidak bertabrakan
            layerToko = L.layerGroup().addTo(map);  // Layer pin merah (Laporan)
            layerLive = L.layerGroup().addTo(map);  // Layer pin biru (Live)

            refreshPeta();
            sinkronisasiBerkala = setInterval(refreshPeta, 5000);
        }

        // Ikon MERAH untuk Check-in Toko
        const ikonToko = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        // Ikon BIRU untuk Posisi Live Sales (Terkini)
        const ikonLive = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        async function refreshPeta() {
            // --- 1. PROSES DATA RUTE & POSISI LIVE ---
            const resRute = await db.from('location_breadcrumbs').select('*').order('recorded_at', { ascending: true });
            if (resRute.data && resRute.data.length > 0) {
                const latlngs = resRute.data.map(t => [t.latitude, t.longitude]);
                routeLine.setLatLngs(latlngs);
                
                // Bersihkan pin live lama agar berganti posisi baru
                layerLive.clearLayers();
                
                // Cari posisi terakhir untuk setiap Sales 
                const posisiTerakhirPerSales = {};
                resRute.data.forEach(toko => {
                    if (toko.nama_sales) {
                        posisiTerakhirPerSales[toko.nama_sales] = toko;
                    }
                });

                // Pasang Pin Biru di posisi terakhir masing-masing sales
                Object.values(posisiTerakhirPerSales).forEach(sales => {
                    L.marker([sales.latitude, sales.longitude], {icon: ikonLive})
                     .bindPopup(`
                        <div style="font-family: 'Poppins', sans-serif; text-align: center; padding: 10px; width: 150px;">
                            <div style="font-size:11px; color: gray; font-weight: bold; letter-spacing: 1px;">📍 POSISI LIVE</div>
                            <div style="color: #2563EB; font-size: 16px; font-weight: 900; margin-top: 5px;">${sales.nama_sales}</div>
                        </div>
                     `)
                     .addTo(layerLive);
                });

                map.panTo(latlngs[latlngs.length - 1]);
            }

            // --- 2. PROSES DATA LAPORAN CHECK-IN ---
            const resToko = await db.from('laporan_kunjungan').select('*');
            if (resToko.data) {
                layerToko.clearLayers();
                resToko.data.forEach(toko => {
                    if (toko.latitude_checkin && toko.longitude_checkin) {
                        const idCardHTML = `
                            <div style="font-family: 'Poppins', sans-serif; width: 250px; text-align: center;">
                                <div style="background: #10B981; color: white; padding: 12px; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                                    👤 ${toko.nama_sales}
                                </div>
                                <div style="background: #F9FAFB; padding: 15px; border-bottom: 3px solid #10B981;">
                                    <span style="font-size: 11px; color: #6B7280; text-transform: uppercase; font-weight: 800; letter-spacing: 1px;">Laporan Kunjungan</span><br>
                                    <b style="font-size: 16px; color: #111827; display: block; margin: 8px 0;">🏪 ${toko.nama_toko_klien}</b>
                                    <hr style="margin: 10px 0; border: 0; border-top: 1px dashed #D1D5DB;">
                                    <i style="font-size: 13px; color: #4B5563; line-height: 1.4; display: block;">"${toko.catatan_pertemuan}"</i>
                                </div>
                            </div>
                        `;
                        L.marker([toko.latitude_checkin, toko.longitude_checkin], {icon: ikonToko})
                         .bindPopup(idCardHTML)
                         .addTo(layerToko);
                    }
                });
            }
        }
    </script>
</body>
</html>
